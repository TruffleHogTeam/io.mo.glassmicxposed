name: Temporary signed APK build (not for PR)

on:
  push:
    branches: [ci/apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - run: bash ./gradlew :app:compileDebugKotlin :xposed:compileDebugKotlin :app:assembleRelease --no-daemon --console=plain
      - name: Audio regression tests
        run: |
          set -euo pipefail
          stdlib=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort -V | tail -1)
          mkdir -p build/audio-regression
          classpath="app/build/tmp/kotlin-classes/debug:xposed/build/tmp/kotlin-classes/debug:$stdlib:build/audio-regression"
          javac -encoding UTF-8 -cp "$classpath" -d build/audio-regression tests/audio/AudioRegression.java tests/audio/TapTimingRegression.java
          java -cp "$classpath" AudioRegression
          java -cp "$classpath" TapTimingRegression
      - name: Sign with the fixed test key
        env:
          KS_B64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          umask 077
          ks="$RUNNER_TEMP/test.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KS_B64" | base64 --decode > "$ks"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out dist/GlassMic-fish-test.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs dist/GlassMic-fish-test.apk | grep SHA-256
      - uses: actions/upload-artifact@v4
        with:
          name: glassmic-fish-test
          path: dist/GlassMic-fish-test.apk
          retention-days: 14
